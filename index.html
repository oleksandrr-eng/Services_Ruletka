<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1630">
<title>New Year Giveaway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1630; --bg2:#10204a; --card:#13254f; --card2:#1c3366; --line:rgba(200,225,255,.12);
  --text:#f6f9ff; --muted:rgba(220,234,255,.66); --accent:#e5303f; --accent2:#ffcf4d; --gold:#ffd45e;
  --common:#6fc3ff; --rare:#5fe08a; --epic:#ff5a6e; --legend:#ffd45e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none;background:#05060b;color:var(--text);font-family:'Manrope',system-ui,-apple-system,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{display:flex;align-items:center;justify-content:center}
button{font-family:inherit}

.phone{position:relative;flex:none;width:390px;height:844px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
@media (max-width:499px){ .phone{position:fixed;top:0;left:0;transform-origin:0 0} }
.phone.full{position:fixed;top:0;left:0;transform-origin:0 0;border-radius:0!important;box-shadow:none!important}
@media (min-width:500px){
  body{background:radial-gradient(900px 600px at 25% 15%,rgba(90,160,255,.18),transparent 60%),radial-gradient(800px 500px at 80% 85%,rgba(229,48,63,.14),transparent 60%),#050a18}
  .phone{border-radius:44px;box-shadow:0 0 0 10px #12131a,0 0 0 11px #23252f,0 40px 120px rgba(0,0,0,.8)}
}
.phone::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;
  background:radial-gradient(520px 260px at 30% 0%,rgba(90,255,190,.14),transparent 70%),radial-gradient(420px 240px at 85% 6%,rgba(120,140,255,.18),transparent 70%),
  radial-gradient(380px 280px at 95% 60%,rgba(229,48,63,.12),transparent 70%),linear-gradient(180deg,#071027 0%,#0b1630 45%,#132a5c 100%)}
#snow{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.garland{position:absolute!important;left:-10px;right:-10px;top:0;height:46px;pointer-events:none;z-index:2}
.garland svg{width:100%;height:100%;overflow:visible}
.bulb{animation:blink 1.4s steps(1) infinite}
.bulb:nth-of-type(2n){animation-delay:-.7s}
.bulb:nth-of-type(3n){animation-delay:-.35s}
@keyframes blink{50%{opacity:.25}}
.phone > *{position:relative;z-index:1}
.phone > #snow{position:absolute;z-index:0}
.phone > .modal,.phone > #confetti,.phone > .toast{position:absolute}

/* header */
.top{flex:none;display:flex;align-items:center;justify-content:space-between;padding:calc(30px + env(safe-area-inset-top)) 18px 0}
.brand{display:flex;align-items:center;gap:10px}
.brand .lg{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#e5303f,#ff7a5a);box-shadow:0 6px 20px rgba(229,48,63,.45)}
.brand b{display:block;font-family:'Unbounded',sans-serif;font-size:15px;font-weight:800;letter-spacing:.02em}
.brand small{display:block;font-size:12px;font-weight:600;color:var(--muted)}

.hero{flex:none;text-align:center;padding:22px 18px 0}
.hero h1{font-family:'Unbounded',sans-serif;font-size:30px;font-weight:800;line-height:1.08;letter-spacing:-.01em}
.hero h1 span{background:linear-gradient(90deg,#ffe58a,#ffd45e 40%,#ff7a5a 75%,#e5303f);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin-top:8px;font-size:14px;font-weight:600;color:var(--muted)}

/* roulette */
.center{position:absolute!important;left:0;right:0;top:calc(50% - 91px);z-index:3}
.wheel{flex:none;position:relative;margin:0;height:182px}
.track{position:absolute;left:0;right:0;top:12px;height:158px;overflow:hidden;
  -webkit-mask:linear-gradient(90deg,transparent 0,#000 16%,#000 84%,transparent 100%);mask:linear-gradient(90deg,transparent 0,#000 16%,#000 84%,transparent 100%)}
.strip{position:absolute;left:0;top:0;display:flex;gap:8px;will-change:transform}
.item{flex:none;width:112px;height:158px;border-radius:16px;background:linear-gradient(180deg,#1b3263,#122550);background:linear-gradient(165deg,color-mix(in srgb,var(--c) 62%,#0f2148) 0%,color-mix(in srgb,var(--c) 22%,#0f2148) 100%);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px 8px;text-align:center;position:relative;overflow:hidden}
.item::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--c)}
.item::before{content:"";position:absolute;left:50%;top:-30px;width:140px;height:90px;margin-left:-70px;border-radius:50%;background:#fff;opacity:.12;filter:blur(20px)}
.badge{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-family:'Unbounded',sans-serif;font-weight:800;font-size:22px;color:#fff;
  background:linear-gradient(145deg,var(--c),rgba(255,255,255,.08));box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.item .nm{font-size:13.5px;font-weight:800;line-height:1.15;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.item .pl{font-size:11px;font-weight:700;color:rgba(255,255,255,.75)}
.item.win{border-color:var(--c);box-shadow:0 0 0 2px var(--c),0 0 30px var(--c)}
.marker{position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;border-radius:2px;background:linear-gradient(var(--gold),#fff,var(--gold));box-shadow:0 0 16px var(--gold);z-index:3}
.marker::before,.marker::after{content:"";position:absolute;left:50%;margin-left:-9px;border:9px solid transparent}
.marker::before{display:none}
.marker .star{position:absolute;left:50%;top:-20px;width:30px;height:30px;margin-left:-15px;filter:drop-shadow(0 0 8px rgba(255,212,94,.9))}
.marker::after{bottom:-2px;border-bottom-color:var(--gold)}

.spinbox{flex:none;padding:22px 18px 0}
.spin{position:relative;width:100%;height:60px;border:none;border-radius:18px;cursor:pointer;color:#fff;font-family:'Unbounded',sans-serif;font-size:18px;font-weight:800;letter-spacing:.04em;overflow:hidden;
  background:linear-gradient(90deg,#c81e30,#e5303f 45%,#ff8a3d);box-shadow:0 10px 30px rgba(229,48,63,.45),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .1s,filter .2s}
.spin::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:sh 2.8s ease-in-out infinite}
@keyframes sh{0%,50%{left:-60%}90%,100%{left:130%}}
.spin:active{transform:scale(.98)}
.spin:disabled{filter:grayscale(.7) brightness(.7);cursor:default}
.spin:disabled::after{display:none}
.hint{margin-top:10px;text-align:center;font-size:13px;font-weight:700;color:var(--muted);min-height:18px}
.hint b{color:var(--text);font-variant-numeric:tabular-nums}

/* my prize (shown after a win) */
.mine{display:none;margin:auto 18px 12px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);align-items:center;gap:12px}
.mine.on{display:flex}
.mine .badge{width:44px;height:44px;font-size:18px;border-radius:13px;flex:none}
.mine .t{flex:1;min-width:0}
.mine .t small{display:block;font-size:11.5px;font-weight:700;color:var(--muted)}
.mine .t b{display:block;font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mine button{flex:none;height:38px;padding:0 14px;border:none;border-radius:11px;background:var(--text);color:var(--bg);font-weight:800;font-size:13px;cursor:pointer}

/* prize list */
.prizes{flex:1;min-height:0;display:flex;flex-direction:column;margin:16px 18px 0}
.prizes h2{flex:none;display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:800;margin-bottom:8px}
.prizes h2 span{font-size:12px;font-weight:700;color:var(--muted)}
.list{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:6px;padding-bottom:8px;
  -webkit-mask:linear-gradient(#000 85%,transparent);mask:linear-gradient(#000 85%,transparent)}
.list::-webkit-scrollbar{display:none}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.badge.pic,.row .dot.pic{background:none;padding:0;overflow:hidden}
.badge.pic img,.row .dot.pic img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.row .dot{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;font-family:'Unbounded',sans-serif;font-size:11px;font-weight:800;color:#fff;background:var(--c)}
.row .n{flex:1;font-size:13px;font-weight:700}
.row .r{font-size:11px;font-weight:800;color:var(--c);text-transform:uppercase;letter-spacing:.06em}
.row .p{width:50px;text-align:right;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.plist{flex:none;margin:auto 0 6px}
.plh{display:flex;justify-content:space-between;padding:0 18px 7px;font-size:13px;font-weight:800}
.plh span{font-size:12px;font-weight:700;color:var(--muted)}
.mq{overflow:hidden;-webkit-mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mqin{display:flex;gap:8px;width:max-content;animation:mq 28s linear infinite}
.mq:active .mqin{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.chipP{flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);white-space:nowrap}
.chipP i.pic{background:none;overflow:hidden}
.chipP i.pic img{width:100%;height:100%;object-fit:cover;display:block}
.chipP i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-style:normal;font-family:'Unbounded',sans-serif;font-size:11px;font-weight:800;color:#fff;background:var(--c)}
.chipP b{font-size:13px;font-weight:800}
.chipP small{font-size:11.5px;font-weight:700;color:var(--muted)}
.foot{flex:none;padding:8px 18px calc(12px + env(safe-area-inset-bottom));text-align:center;font-size:10.5px;font-weight:600;color:rgba(232,235,255,.38)}

.phone.wide .hero{max-width:520px;margin:0 auto}
.phone.wide .spinbox{width:100%;max-width:420px;margin:0 auto}
/* win modal */
.modal{position:absolute;top:0;right:0;bottom:0;left:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(4,10,26,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .25s}
.modal.open{opacity:1;pointer-events:auto}
.wcard{position:relative;width:100%;max-width:400px;border-radius:26px;padding:26px 20px 20px;text-align:center;background:linear-gradient(180deg,#1c3366,#0f2148);border:1px solid rgba(255,255,255,.1);overflow:hidden;transform:scale(.8);transition:transform .45s cubic-bezier(.2,1.5,.4,1);box-shadow:0 0 0 1px var(--c),0 0 60px color-mix(in srgb,var(--c) 45%,transparent)}
.modal.open .wcard{transform:scale(1)}
.wcard .rays{position:absolute;left:50%;top:92px;width:520px;height:520px;margin:-260px 0 0 -260px;pointer-events:none;opacity:.35;
  background:repeating-conic-gradient(from 0deg,var(--c) 0 7deg,transparent 7deg 20deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 58%);mask:radial-gradient(circle,#000 0,transparent 58%);animation:spinr 16s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
.wcard > *{position:relative}
.wcard .tier{display:none;padding:5px 12px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.wcard .badge{width:96px;height:96px;margin:16px auto 0;border-radius:28px;font-size:40px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.wcard h3{margin-top:16px;font-family:'Unbounded',sans-serif;font-size:22px;font-weight:800}
.wcard .what{margin-top:6px;font-size:17px;font-weight:800}
.wcard .what span{color:var(--c);color:color-mix(in srgb,var(--c) 50%,#fff)}
.code{margin:16px auto 0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 10px 10px 14px;border-radius:14px;background:rgba(0,0,0,.35);border:1px dashed rgba(255,255,255,.22)}
.code small{display:block;text-align:left;font-size:10.5px;font-weight:700;color:var(--muted)}
.code b{display:block;font-family:'Unbounded',sans-serif;font-size:16px;font-weight:600;letter-spacing:.06em}
.code button{flex:none;height:36px;padding:0 12px;border:none;border-radius:10px;background:var(--card2);color:var(--text);font-weight:800;font-size:12.5px;cursor:pointer}
.gen{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;margin-top:16px;border:1.5px dashed color-mix(in srgb,var(--c) 70%,#fff);border-radius:14px;background:color-mix(in srgb,var(--c) 16%,transparent);color:#fff;font-weight:800;font-size:15px;cursor:pointer;animation:gpulse 1.6s ease-in-out infinite}
@keyframes gpulse{50%{box-shadow:0 0 22px color-mix(in srgb,var(--c) 60%,transparent)}}
.gen:active{transform:scale(.98)}
.genbox{display:none;margin-top:16px;padding:14px 12px 12px;border-radius:14px;background:rgba(0,0,0,.35)}
.genbox.on{display:block}
.gbar{height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.gbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),#fff)}
.gcode{margin-top:12px;font-family:'Unbounded',sans-serif;font-size:21px;font-weight:600;letter-spacing:.08em;font-variant-numeric:tabular-nums;min-height:28px}
.gcode.done{animation:gdone .45s cubic-bezier(.2,1.6,.4,1);text-shadow:0 0 14px color-mix(in srgb,var(--c) 80%,transparent)}
@keyframes gdone{0%{transform:scale(.85)}100%{transform:scale(1)}}
.gstep{margin-top:6px;min-height:16px;font-size:12px;font-weight:700;color:var(--muted)}
.gcopy{display:none;margin:10px auto 0;height:38px;padding:0 18px;border:none;border-radius:10px;background:#fff;color:#0b1630;font-weight:800;font-size:13.5px;cursor:pointer}
.gcopy.on{display:block}
.wcard .how{display:none}
.wcard .how.on{display:block}
.wcard .how{margin-top:12px;font-size:12.5px;line-height:1.45;font-weight:600;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;margin-top:14px;border:none;border-radius:16px;font-weight:800;font-size:16px;color:#fff;cursor:pointer;text-decoration:none;background:linear-gradient(90deg,#c81e30,#ff8a3d);box-shadow:0 8px 24px rgba(229,48,63,.4)}
.btn.ghost{background:rgba(255,255,255,.07);box-shadow:none;height:46px;margin-top:8px;font-size:14px}
.toast{position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));z-index:90;transform:translate(-50%,16px);padding:10px 16px;border-radius:12px;background:#fff;color:#0a0b14;font-size:13.5px;font-weight:800;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
#confetti{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;z-index:60;pointer-events:none}

.phone.short .hero{padding-top:12px}
.phone.short .hero h1{font-size:25px}
.phone.short .spinbox{padding-top:14px}
.phone.short .center{top:calc(50% - 91px - 34px)}
.phone.short .mine{padding:9px 12px;margin-bottom:9px}
.phone.short .mine .badge{width:38px;height:38px;font-size:16px}
</style>
</head>
<body>
<div class="phone" id="phone">
  <canvas id="snow"></canvas>
  <div class="garland" aria-hidden="true"><svg viewBox="0 0 410 46" preserveAspectRatio="none"><path d="M0 4Q50 44 100 12T200 12 300 12 410 8" fill="none" stroke="#1d2b3a" stroke-width="2"/><circle class="bulb" cx="22" cy="20" r="5" fill="#ff5a5a" style="filter:drop-shadow(0 0 6px #ff5a5a)"/><circle class="bulb" cx="52" cy="29" r="5" fill="#ffd45e" style="filter:drop-shadow(0 0 6px #ffd45e)"/><circle class="bulb" cx="82" cy="24" r="5" fill="#5ac8ff" style="filter:drop-shadow(0 0 6px #5ac8ff)"/><circle class="bulb" cx="114" cy="13" r="5" fill="#7dff8a" style="filter:drop-shadow(0 0 6px #7dff8a)"/><circle class="bulb" cx="148" cy="26" r="5" fill="#ff5a5a" style="filter:drop-shadow(0 0 6px #ff5a5a)"/><circle class="bulb" cx="178" cy="23" r="5" fill="#ffd45e" style="filter:drop-shadow(0 0 6px #ffd45e)"/><circle class="bulb" cx="214" cy="13" r="5" fill="#5ac8ff" style="filter:drop-shadow(0 0 6px #5ac8ff)"/><circle class="bulb" cx="246" cy="26" r="5" fill="#7dff8a" style="filter:drop-shadow(0 0 6px #7dff8a)"/><circle class="bulb" cx="278" cy="23" r="5" fill="#ff5a5a" style="filter:drop-shadow(0 0 6px #ff5a5a)"/><circle class="bulb" cx="314" cy="13" r="5" fill="#ffd45e" style="filter:drop-shadow(0 0 6px #ffd45e)"/><circle class="bulb" cx="348" cy="25" r="5" fill="#5ac8ff" style="filter:drop-shadow(0 0 6px #5ac8ff)"/><circle class="bulb" cx="384" cy="17" r="5" fill="#7dff8a" style="filter:drop-shadow(0 0 6px #7dff8a)"/></svg></div>
  <div class="top">
    <div class="brand">
      <div class="lg"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="9" width="17" height="11.5" rx="1.5"/><path d="M2.5 6.5h19V9h-19Z" fill="#fff"/><path d="M12 6.5v14"/><path d="M12 6.5C10 3 6.5 3 6.8 5.2 7 6.6 10 6.5 12 6.5Zm0 0c2-3.5 5.5-3.5 5.2-1.3-.2 1.4-3.2 1.3-5.2 1.3Z" fill="#ffd45e" stroke="#ffd45e"/></svg></div>
      <div><b id="chName">NEW YEAR DROP</b><small>Holiday giveaway</small></div>
    </div>
  </div>

  <div class="hero">
    <h1>Spin &amp; win<br><span>a premium subscription</span></h1>
    <p>Happy New Year! Spin as many times as you like 🎄</p>
  </div>

  <div class="center">
  <div class="wheel">
    <div class="track" id="track"><div class="strip" id="strip"></div></div>
    <div class="marker"><svg class="star" viewBox="0 0 24 24"><path d="M12 1.5l3.1 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.3l-6.4 3.6 1.5-7.1-5.4-4.9 7.2-.8Z" fill="#ffd45e" stroke="#a46c06" stroke-width="1"/></svg></div>
  </div>

  <div class="spinbox">
    <button class="spin" id="spinBtn">SPIN</button>
    <div class="hint" id="hint"></div>
  </div>
  </div>


  <div class="plist">
    <div class="plh">All prizes <span id="plCount"></span></div>
    <div class="mq"><div class="mqin" id="mq"></div></div>
  </div>


  <div class="modal" id="winModal"><div class="wcard" id="winCard">
    <div class="rays"></div>
    <div class="tier" id="wTier"></div>
    <div class="badge" id="wBadge"></div>
    <h3>Congratulations! 🎉</h3>
    <div class="what">You won <span id="wName"></span></div>
    <div class="genbox" id="genBox">
      <div class="gbar"><i id="gBar"></i></div>
      <div class="gcode" id="wCode"></div>
      <div class="gstep" id="gStep"></div>
      <button class="gcopy" id="copyBtn">Copy code</button>
    </div>
    <div class="how" id="how">Send this code or a screenshot to the channel admin to get your subscription.</div>
    <button class="btn" id="genBtn">Generate code</button>
    <button class="btn ghost" id="closeBtn">Close</button>
  </div></div>

  <canvas id="confetti"></canvas>
  <div class="toast" id="toast"></div>
</div>

<script>
/* =====================  НАСТРОЙКИ — меняй здесь  ===================== */
const CHANNEL_NAME = 'NEW YEAR DROP';               // название канала в шапке
const COOLDOWN_HOURS = 0;                           // как часто можно крутить (0 = без ограничений)
const SPIN_SECONDS = 5;                             // длительность прокрутки
// Призы: name — что выпадает, plan — подпись, letter — буква на значке,
// tier: common | rare | epic | legend — только цвет карточки. У всех призов одинаковый шанс.

      for (const s of flakes){ s.y += s.vy * dt * (s.r / 2); s.sw += dt * s.sp; s.x += Math.sin(s.sw) * .35; if (s.y > H + 10) Object.assign(s, mk(false));
        ctx.globalAlpha = .45 + s.r / 7; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill(); }
      ctx.globalAlpha = 1; requestAnimationFrame(f);
    })(last);
    if (window.ResizeObserver) new ResizeObserver(size).observe(c); else addEventListener('resize', size);
    size();
  })();
